# Perfil local: H2 en memoria en modo MySQL (sin instalar nada).
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:h2:mem:inventario;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
